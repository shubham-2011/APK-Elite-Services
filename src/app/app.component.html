<div class="bdy" [class.cms-mode]="isCmsRoute">
  <div class="nav" *ngIf="!isCmsRoute">
    <app-nav-bar></app-nav-bar>
  </div>

  <main id="main-content" [class.cms-viewport]="isCmsRoute">
    <router-outlet></router-outlet>
  </main>

  <app-add-footer *ngIf="!isCmsRoute"></app-add-footer>

  <!-- Global Quote Popup Modal -->
  <app-quote-modal *ngIf="!isCmsRoute"></app-quote-modal>

  <!-- Floating Action Buttons -->
  <div class="floating-icons" *ngIf="!isCmsRoute">
    <a [href]="getDynamicWhatsAppUrl('FloatingIcon')"
       (click)="trackCtaClick('whatsapp', 'floating-icon')"
       target="_blank"
       rel="noopener"
       class="icon whatsapp"
       aria-label="WhatsApp APK Elite Services"
       data-umami-event="whatsapp-float-icon">
      <i class="fab fa-whatsapp"></i>
    </a>

    <a href="mailto:info@apkeliteservices.in"
       (click)="trackCtaClick('email', 'floating-icon')"
       class="icon email"
       aria-label="Email APK Elite Services"
       data-umami-event="email-float-icon">
      <i class="fas fa-envelope"></i>
    </a>
  </div>

  <a [href]="getDynamicWhatsAppUrl('FloatBox')"
     *ngIf="!isCmsRoute"
     (click)="trackCtaClick('whatsapp', 'floating-box')"
     target="_blank"
     rel="noopener"
     class="whatsapp-box"
     aria-label="Chat with APK Elite Services on WhatsApp"
     data-umami-event="whatsapp-float-box">
    <i class="fab fa-whatsapp"></i>
    <span>How can we assist you?</span>
  </a>

  <!-- Mobile Sticky CTA Bar -->
  <div class="mobile-sticky-cta" *ngIf="!isCmsRoute">
    <a href="tel:+918830167863"
       (click)="trackCtaClick('call', 'mobile-sticky')"
       class="cta-call"
       aria-label="Call APK Elite Services"
       data-umami-event="call-sticky-mobile">
      <i class="fas fa-phone-alt"></i> Call Now
    </a>
    <a [href]="getDynamicWhatsAppUrl('StickyMobile')"
       (click)="trackCtaClick('whatsapp', 'mobile-sticky')"
       target="_blank"
       rel="noopener"
       class="cta-whatsapp"
       aria-label="WhatsApp APK Elite Services"
       data-umami-event="whatsapp-sticky-mobile">
      <i class="fab fa-whatsapp"></i> WhatsApp
    </a>
  </div>
</div>
